[dependency-groups]
tests = [
  "prettytable>=3.14",
  "pytest>=9",
  "pytest-cov",
  "termcolor",
]

[tool.black]
target_version = [ "py311" ]

[tool.ruff]
fix = true
lint.extend-select = [
  "C4",     # flake8-comprehensions
  "E",      # pycodestyle errors
  "EM",     # flake8-errmsg
  "F",      # pyflakes
  "I",      # isort
  "ICN",    # flake8-import-conventions
  "ISC",    # flake8-implicit-str-concat
  "LOG",    # flake8-logging
  "PERF",   # perflint
  "PGH",    # pygrep-hooks
  "PIE",    # flake8-pie
  "PYI",    # flake8-pyi
  "RUF022", # unsorted-dunder-all
  "RUF100", # unused noqa (yesqa)
  "TID251", # flake8-tidy-imports: banned-api
  "UP",     # pyupgrade
  "W",      # pycodestyle warnings
  "YTT",    # flake8-2020
]
lint.ignore = [
  "PIE790", # flake8-pie: unnecessary-placeholder
]
lint.flake8-import-conventions.aliases.datetime = "dt"
lint.flake8-import-conventions.banned-from = [ "datetime" ]
lint.flake8-pytest-style.parametrize-names-type = "csv"
lint.flake8-tidy-imports.banned-api."re.match".msg = "use re.fullmatch() or re.search() instead"
lint.flake8-tidy-imports.banned-api."typing.TYPE_CHECKING".msg = "use TYPE_CHECKING = False instead"
lint.isort.required-imports = [ "from __future__ import annotations" ]

[tool.pyproject-fmt]
generate_python_version_classifiers = false

[tool.pytest]
minversion = "9.0"
testpaths = [ "tests" ]

[tool.coverage]
run.disable_warnings = [ "no-sysmon" ]  # 3.11 and earlier
run.core = "sysmon"  # default for 3.14+, available for 3.12+
# Regexes for lines to exclude from consideration
report.exclude_also = [
  # Don't complain if non-runnable code isn't run:
  "if __name__ == .__main__.:",
]
